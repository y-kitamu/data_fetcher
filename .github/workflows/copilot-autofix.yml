name: Auto-fix Failed Workflow with Copilot

on:
  workflow_run:
    workflows: ["Update Stock Data", "Update Japanese Stock Data", "Run Tests"]
    types: [completed]

permissions:
  issues: write

jobs:
  create-fix-issue:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check for existing open auto-fix issue
        id: check
        env:
          GH_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          set -e
          MARKER="[auto-fix] ${{ github.event.workflow_run.name }}"
          EXISTING=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --search "\"$MARKER\" in:title" \
            --json number \
            --jq '.[0].number // empty')
          echo "existing=$EXISTING" >> "$GITHUB_OUTPUT"

      - name: Create issue and assign to Copilot
        if: steps.check.outputs.existing == ''
        env:
          GH_TOKEN: ${{ secrets.COPILOT_PAT }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -e
          BODY=$(cat <<EOF
          Workflow **$WORKFLOW_NAME** failed on \`main\` (commit $HEAD_SHA).
          Run log: $RUN_URL
          @copilot please investigate the failure logs in the run above, identify the root cause, and open a pull request that fixes it.
          EOF
          )
          ISSUE_URL=$(gh issue create \
            --repo "${{ github.repository }}" \
            --title "[auto-fix] $WORKFLOW_NAME failed (run #$RUN_NUMBER)" \
            --body "$BODY")
          ISSUE_NUM=$(basename "$ISSUE_URL")
          gh issue edit "$ISSUE_NUM" --repo "${{ github.repository }}" --add-assignee "@copilot"
